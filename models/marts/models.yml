version: 2

models:
  - name: fct_netflix_views
    description: "Tabla de hechos: visualizaciones de contenidos Netflix."
    columns:
      - name: sk_movie_show_id
        tests: [not_null]
      - name: imdb_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10
      - name: view_date
        tests: [not_null]
  - name: dim_movie_show
    description: "Dimensión de contenidos Netflix."
    columns:
      - name: sk_movie_show_id
        tests: [unique,not_null]
      - name: movie_title
        tests: [not_null]